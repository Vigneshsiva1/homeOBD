# X server for the 3.5in panel kiosk: draw on the panel's framebuffer only, never blank.
# Installed by install-kiosk.sh. The framebuffer comes from $FRAMEBUFFER, which
# homeobd-kiosk.service sets: the fbdev driver won't open the /dev/fb-panel symlink itself.
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "panel"
    Driver "fbdev"
EndSection

Section "Screen"
    Identifier "panel"
    Device "panel"
EndSection
