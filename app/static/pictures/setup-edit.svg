ke="#3a3d43"/><text x="58" y="210" font-size="12" font-weight="600" fill="#9a9ca3" text-anchor="middle">OK</text><text x="92" y="210" font-size="13" font-weight="600" fill="#f2a33a" text-anchor="start">K0002</text><text x="140" y="210" font-size="13" font-weight="600" fill="#f2f0ea" text-anchor="start">Wipe counters</text><text x="36" y="234" font-size="11" font-weight="500" fill="#9a9ca3" text-anchor="start">Every 2 d · about 10 min · Due in 2 d</text><rect x="186" y="244" width="52" height="26" rx="8" fill="#2c2e33" stroke="#3a3d43"/><text x="212" y="261" font-size="12" font-weight="600" fill="#f2f0ea" text-anchor="middle">Edit</text><rect x="244" y="244" width="62" height="26" rx="8" fill="#2c2e33" stroke="#3a3d43"/><text x="275" y="261" font-size="12" font-weight="600" fill="#ff7a6b" text-anchor="middle">Delete</text><circle cx="166" cy="153" r="11" fill="#f2a33a"/><text x="166" y="157.5" font-size="13" font-weight="700" fill="#1a1206" text-anchor="middle">1</text><text x="28" y="296" font-size="11" font-weight="500" fill="#9a9ca3" text-anchor="start">Tap Edit, change it in the form, then Save changes.</text></svg>
