<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121315">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="APT-OBD">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>APT-OBD</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/scantool.css">
</head>
<body>
<main>
  <div class="device-wrap">
    <div class="cable" aria-hidden="true"></div>
    <div class="plug" aria-hidden="true"></div>
    <section class="device" aria-label="Apartment scan tool">
      <div class="brand">
        <span class="brand-name">APT-OBD</span>
        <span class="brand-sub">Maintenance scanner</span>
        <a class="setup-link" href="/setup">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Setup
        </a>
      </div>
      <div class="bezel">
        <div id="screen" class="screen theme-classic" role="region" aria-live="polite" aria-label="Scanner screen">
          <div class="screen-head">
            <button type="button" id="back" class="back" hidden>
              <svg aria-hidden="true" viewBox="0 0 12 21" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 1.5 10.5 10 19"/></svg>
              Back
            </button>
            <span id="title" class="title clip"></span>
            <span id="lamp" class="lamp" hidden>CHK APT</span>
          </div>
          <div id="body" class="screen-body"></div>
          <div id="foot" class="screen-foot"></div>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="/static/scantool.js"></script>
</body>
</html>
