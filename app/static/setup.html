<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121315">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="APT-OBD">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>APT-OBD Setup</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/setup.css">
</head>
<body>
<main>
  <header class="top">
    <a class="back-link" href="/"><svg aria-hidden="true" viewBox="0 0 12 21" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 1.5 10.5 10 19"/></svg>Scanner</a>
    <h1>APT-OBD <span>Setup</span></h1>
  </header>

  <section class="card">
    <h2>Scanner</h2>
    <form id="settings-form" class="grid">
      <label>Screen theme
        <select id="theme"></select>
      </label>
      <label>Unit ID
        <input id="unit-id" required maxlength="12">
      </label>
      <div class="form-actions">
        <button type="submit" class="btn primary">Save</button>
        <span id="settings-msg" class="msg" role="status"></span>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>Notifications</h2>
    <p class="hint">Quick daily chores at <b>8 pm</b>. Other chores at <b>8 am</b>, with a <b>6 pm</b> reminder on weekdays. Chores that take an hour or more only on <b>Saturday and Sunday</b>, at 8 am and 6 pm. To pick a fixed time for a chore, set <b>Notify at</b> when editing it.</p>
    <div class="form-actions">
      <button type="button" id="push-on" class="btn primary">Turn on notifications</button>
      <button type="button" id="push-test" class="btn" hidden>Send test</button>
      <button type="button" id="push-off" class="btn" hidden>Turn off</button>
      <span id="push-msg" class="msg" role="status"></span>
    </div>
  </section>

  <section class="card">
    <h2 id="form-title">Add chore</h2>
    <form id="chore-form" class="grid">
      <label>Zone
        <select id="zone"></select>
      </label>
      <label>Type
        <select id="category"></select>
      </label>
      <label class="wide">Name
        <input id="name" required maxlength="60" placeholder="e.g. Clean oven">
      </label>
      <label>Every (days)
        <input id="interval" type="number" required min="1" max="3650" inputmode="numeric">
      </label>
      <label>Last done <small>(blank = today)</small>
        <input id="last-done" type="date">
      </label>
      <label>Takes about (minutes) <small>(1 h+ = weekend reminders)</small>
        <input id="minutes" type="number" required min="1" max="1440" inputmode="numeric" value="15">
      </label>
      <label>Notify at
        <select id="notify-slot">
          <option value="auto">Automatic</option>
          <option value="am">8 am every day</option>
          <option value="pm">6 pm every day</option>
          <option value="eve">8 pm every day</option>
        </select>
      </label>
      <label class="wide">Notes <small>(optional)</small>
        <textarea id="description" maxlength="500" rows="2"></textarea>
      </label>
      <label class="wide">How to do it <small>(one step per line; shown under Help)</small>
        <textarea id="how-to" maxlength="2000" rows="4" placeholder="1. Scrape food into the trash&#10;2. Wash glasses first, pans last"></textarea>
      </label>
      <label class="wide">Done when <small>(what finished looks like)</small>
        <textarea id="done-when" maxlength="500" rows="2" placeholder="Sink empty, drain catch cleared"></textarea>
      </label>
      <div class="form-actions">
        <button type="submit" id="save-chore" class="btn primary">Add chore</button>
        <button type="button" id="cancel-edit" class="btn" hidden>Cancel</button>
        <span id="chore-msg" class="msg" role="status"></span>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>Chores <span id="chore-count" class="count"></span></h2>
    <div id="chore-list"></div>
  </section>
</main>
<script src="/static/setup.js"></script>
</body>
</html>
