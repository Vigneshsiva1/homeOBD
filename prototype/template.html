<style>
body{margin:0;background:#121315}
a{color:#f2a33a}a:hover{color:#ffc46e}
</style>
</helmet>
<main style="min-height: 100vh; box-sizing: border-box; background: #121315; display: flex; justify-content: center; align-items: flex-start; padding: 24px 16px 40px; font-family: 'Chakra Petch', system-ui, sans-serif" data-canvas-width="1280" data-canvas-height="900" data-document-role="page" data-label="Scan tool web app">
<div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center">
<div aria-hidden="true" style="width: 14px; height: 26px; background: #26282c"></div>
<div aria-hidden="true" style="width: 72px; height: 18px; background: #26282c; border-radius: 10px 10px 0 0"></div>
<section aria-label="Apartment scan tool" style="width: 100%; box-sizing: border-box; background: #1c1d20; border: 1px solid #2a2c30; border-radius: 28px; padding: 20px 20px 26px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 4px">
<span style="font-size: 18px; font-weight: 600; letter-spacing: 0.08em; color: #f2f0ea">APT-OBD</span>
<span style="font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: #9a9ca3">Maintenance scanner</span>
</div>
<div style="background: #0b0c0e; border-radius: 12px; padding: 10px">
<div role="region" aria-live="polite" aria-label="Scanner screen" style="background: {{t.screenBg}}; color: {{t.ink}}; border-radius: 4px; font-family: 'VT323', ui-monospace, monospace; min-height: 340px; display: flex; flex-direction: column; overflow: hidden">
<div style="background: {{t.headBg}}; color: {{t.headInk}}; padding: 3px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 24px; line-height: 1.25">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0">{{title}}</span>
<sc-if value="{{lampOn}}" hint-placeholder-val="{{ true }}">
<span style="background: #f2a33a; color: #1a1206; font-size: 18px; padding: 0 6px; border-radius: 3px; line-height: 1.3; white-space: nowrap">CHK APT</span>
</sc-if>
</div>
<div style="flex: 1; padding: 8px 0; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{lines}}" as="ln" hint-placeholder-count="2">
<div style="padding: 0 10px; font-size: 22px; line-height: 1.2">{{ln}}</div>
</sc-for>
<sc-if value="{{isBoot}}" hint-placeholder-val="{{ false }}">
<div style="margin: 14px 10px 0; height: 18px; box-sizing: border-box; border: 2px solid {{t.ink}}; padding: 2px">
<div style="height: 100%; width: {{bar}}; background: {{t.ink}}"></div>
</div>
</sc-if>
<sc-for list="{{pairs}}" as="p" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 0 10px; font-size: 21px; line-height: 1.22">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: {{t.dim}}">{{p.k}}</span>
<span style="white-space: nowrap">{{p.v}}</span>
</div>
</sc-for>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<button type="button" sc-camel-on-click="{{r.pick}}" style="appearance: none; border: 0; margin: 0; width: 100%; min-height: 32px; padding: 2px 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: {{r.bg}}; color: {{r.ink}}; font-family: 'VT323', ui-monospace, monospace; font-size: 22px; line-height: 1.15; text-align: left; cursor: pointer">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0">{{r.label}}</span>
<span style="white-space: nowrap">{{r.tag}}</span>
</button>
</sc-for>
</div>
<div style="border-top: 2px solid {{t.dim}}; padding: 3px 10px; font-size: 18px; line-height: 1.25; color: {{t.dim}}">{{foot}}</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<button type="button" aria-label="Up" sc-camel-on-click="{{up}}" style="height: 64px; border-radius: 16px; border: 1px solid #3a3d43; background: #2c2e33; color: #f2a33a; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="28" height="28" sc-camel-view-box="0 0 24 24" fill="none" stroke="#f2a33a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg>
</button>
<button type="button" sc-camel-on-click="{{enter}}" style="height: 64px; border-radius: 16px; border: 1px solid #f2a33a; background: #f2a33a; color: #1a1206; font-family: 'Chakra Petch', system-ui, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 0.12em; cursor: pointer">ENTER</button>
<button type="button" aria-label="Down" sc-camel-on-click="{{down}}" style="height: 64px; border-radius: 16px; border: 1px solid #3a3d43; background: #2c2e33; color: #f2a33a; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="28" height="28" sc-camel-view-box="0 0 24 24" fill="none" stroke="#f2a33a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<button type="button" sc-camel-on-click="{{exit}}" style="height: 64px; border-radius: 16px; border: 1px solid #3a3d43; background: #2c2e33; color: #f2f0ea; font-family: 'Chakra Petch', system-ui, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 0.12em; cursor: pointer">EXIT</button>
</div>
</section>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;classic&quot;,&quot;amber&quot;,&quot;green&quot;],&quot;default&quot;:&quot;classic&quot;,&quot;section&quot;:&quot;Screen&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      screen: 'boot', progress: 0, menuIdx: 0, listIdx: 0, freezeIdx: 0,
      sel: null, msg: [], msgTitle: '', ret: 'menu',
      status: { K2002: 'active', L0002: 'active', K0001: 'active', B1004: 'active', U2001: 'active' }
    };
  }

  componentDidMount() {
    this.timer = setInterval(() => {
      if (this.state.screen !== 'boot') { clearInterval(this.timer); return; }
      const p = this.state.progress + 10;
      if (p >= 100) { clearInterval(this.timer); this.setState({ screen: 'menu', progress: 100 }); }
      else this.setState({ progress: p });
    }, 140);
  }

  componentWillUnmount() { clearInterval(this.timer); }

  theme() {
    const all = {
      classic: { screenBg: '#e9eef4', ink: '#10223f', headBg: '#2457b3', headInk: '#ffffff', selBg: '#2457b3', selInk: '#ffffff', dim: '#4f6380' },
      amber: { screenBg: '#140c02', ink: '#ffb340', headBg: '#ffb340', headInk: '#140c02', selBg: '#ffb340', selInk: '#140c02', dim: '#c98a2e' },
      green: { screenBg: '#c4cfa1', ink: '#1f2a12', headBg: '#1f2a12', headInk: '#c4cfa1', selBg: '#1f2a12', selInk: '#c4cfa1', dim: '#3f5228' }
    };
    return all[this.props.screen ?? 'classic'] || all.classic;
  }

  codes() {
    return [
      { id: 'K2002', name: 'Clean fridge coils', zone: 'Kitchen', state: 'PERM', due: 'Overdue 200 d', interval: '180 d', last: 'Oct 8, 2025', set: 'Apr 6, 2026', hSet: 94, sSet: 12 },
      { id: 'L0002', name: 'Vacuum living room', zone: 'Living', state: 'CONF', due: 'Overdue 3 d', interval: '7 d', last: 'Oct 13, 2026', set: 'Oct 20, 2026', hSet: 89, sSet: 0 },
      { id: 'K0001', name: 'Wash dishes', zone: 'Kitchen', state: 'CONF', due: 'Overdue 1 d', interval: '1 d', last: 'Oct 21, 2026', set: 'Oct 22, 2026', hSet: 83, sSet: 0 },
      { id: 'B1004', name: 'Scrub shower', zone: 'Bath', state: 'PEND', due: 'Due in 1 d', interval: '14 d', last: 'Oct 10, 2026' },
      { id: 'U2001', name: 'Replace HVAC filter', zone: 'Utility', state: 'PEND', due: 'Due in 3 d', interval: '90 d', last: 'Jul 28, 2026' }
    ];
  }

  listActive() {
    const rank = { PERM: 0, CONF: 1, PEND: 2 };
    return this.codes().filter(c => this.state.status[c.id] === 'active').sort((a, b) => rank[a.state] - rank[b.state]);
  }

  overdueWith(status) { return this.codes().filter(c => c.state !== 'PEND' && status[c.id] !== 'done').length; }
  overdue() { return this.overdueWith(this.state.status); }
  health() { return Math.round((18 - this.overdue()) / 18 * 100); }
  lampOn() { return this.codes().some(c => c.state !== 'PEND' && this.state.status[c.id] === 'active'); }

  service() {
    const st = this.state.status;
    return [
      { id: 'K2002', name: 'Fridge coils', days: st.K2002 === 'done' ? 180 : -200 },
      { id: 'U2001', name: 'HVAC filter', days: st.U2001 === 'done' ? 90 : 3 },
      { id: 'G2001', name: 'Smoke alarms', days: 9 },
      { id: 'K2003', name: 'Descale kettle', days: 21 },
      { id: 'B2001', name: 'Bath fan', days: 47 }
    ].sort((a, b) => a.days - b.days);
  }

  move(d) {
    const s = this.state;
    const wrap = (i, n) => (n ? (i + d + n) % n : 0);
    if (s.screen === 'menu') this.setState({ menuIdx: wrap(s.menuIdx, 7) });
    else if (s.screen === 'codes') this.setState({ listIdx: wrap(s.listIdx, this.listActive().length) });
    else if (s.screen === 'freezeList') this.setState({ freezeIdx: wrap(s.freezeIdx, this.listActive().length) });
  }

  enter() {
    const s = this.state;
    const list = this.listActive();
    if (s.screen === 'boot') { this.setState({ screen: 'menu' }); return; }
    if (s.screen === 'menu') {
      const go = ['codes', 'erase', 'live', 'freezeList', 'ready', 'service', 'info'][s.menuIdx];
      this.setState({ screen: go, listIdx: 0, freezeIdx: 0 });
      return;
    }
    if (s.screen === 'codes') {
      if (!list.length) return;
      this.setState({ screen: 'detail', sel: list[Math.min(s.listIdx, list.length - 1)].id });
      return;
    }
    if (s.screen === 'detail') { this.setState({ screen: 'confirm' }); return; }
    if (s.screen === 'confirm') {
      const status = Object.assign({}, s.status);
      status[s.sel] = 'done';
      const h = Math.round((18 - this.overdueWith(status)) / 18 * 100);
      this.setState({ status, screen: 'msg', msgTitle: 'Code cleared', msg: [s.sel + ' cleared.', 'Health now ' + h + ' %.'], ret: 'codes', listIdx: 0 });
      return;
    }
    if (s.screen === 'msg') { this.setState({ screen: s.ret || 'menu' }); return; }
    if (s.screen === 'erase') {
      const can = list.filter(c => c.state !== 'PERM');
      if (!can.length) { this.setState({ screen: 'menu' }); return; }
      const status = Object.assign({}, s.status);
      can.forEach(c => { status[c.id] = 'snoozed'; });
      const perm = list.filter(c => c.state === 'PERM').length;
      const msg = [can.length + (can.length === 1 ? ' code' : ' codes') + ' erased.'];
      if (perm) msg.push(perm === 1 ? '1 permanent code keeps' : perm + ' permanent codes keep', 'CHECK APT on.');
      else msg.push('CHECK APT off for 24 h.');
      msg.push('Health is unchanged:', 'the chores still wait.');
      this.setState({ status, screen: 'msg', msgTitle: 'Codes erased', msg, ret: 'menu' });
      return;
    }
    if (s.screen === 'freezeList') {
      if (!list.length) return;
      this.setState({ screen: 'freeze', sel: list[Math.min(s.freezeIdx, list.length - 1)].id });
    }
  }

  exit() {
    const s = this.state;
    if (s.screen === 'msg') { this.setState({ screen: s.ret || 'menu' }); return; }
    const back = { boot: 'menu', codes: 'menu', erase: 'menu', live: 'menu', freezeList: 'menu', ready: 'menu', service: 'menu', info: 'menu', detail: 'codes', confirm: 'detail', freeze: 'freezeList' };
    if (back[s.screen]) this.setState({ screen: back[s.screen] });
  }

  pick(i) {
    const key = { menu: 'menuIdx', codes: 'listIdx', freezeList: 'freezeIdx' }[this.state.screen];
    if (!key) return;
    const o = {};
    o[key] = i;
    this.setState(o, () => this.enter());
  }

  view() {
    const s = this.state;
    const t = this.theme();
    const list = this.listActive();
    const lamp = this.lampOn();
    const row = (label, tag, on, i) => ({ label, tag, bg: on ? t.selBg : 'transparent', ink: on ? t.selInk : t.ink, pick: () => this.pick(i) });
    const kv = (k, v) => ({ k, v: String(v) });
    const full = { PERM: 'Permanent', CONF: 'Confirmed', PEND: 'Pending' };
    const find = id => this.codes().filter(c => c.id === id)[0];
    const moveFoot = '▲▼ move  ENTER view  EXIT back';
    let title = '', lines = [], rows = [], pairs = [], foot = 'EXIT back', boot = false;

    if (s.screen === 'boot') {
      title = 'APT-OBD';
      lines = ['Software v1.0', 'Linking to unit APT-01', 'Please wait  ' + s.progress + ' %'];
      boot = true;
      foot = 'ENTER skip';
    } else if (s.screen === 'menu') {
      title = 'Diagnostic menu';
      const names = ['Read codes', 'Erase codes', 'Live data', 'Freeze frame', 'Readiness', 'Service due', 'Unit info'];
      rows = names.map((n, i) => row(n, i === 0 && list.length ? String(list.length) : '', i === s.menuIdx, i));
      foot = '▲▼ move  ENTER open';
    } else if (s.screen === 'codes') {
      title = 'Read codes';
      if (!list.length) lines = ['No codes found.', 'Apartment is healthy.'];
      else { rows = list.map((c, i) => row(c.id + ' ' + c.name, c.state, i === s.listIdx, i)); foot = moveFoot; }
    } else if (s.screen === 'detail') {
      const c = find(s.sel);
      title = c.id;
      lines = [c.name];
      pairs = [kv('Zone', c.zone), kv('State', full[c.state]), kv('Status', c.due), kv('Interval', c.interval), kv('Last done', c.last)];
      foot = 'ENTER mark done  EXIT back';
    } else if (s.screen === 'confirm') {
      title = 'Mark done';
      lines = ['Mark ' + s.sel + ' done?', 'Only if the chore', 'is really finished.'];
      foot = 'ENTER yes  EXIT no';
    } else if (s.screen === 'msg') {
      title = s.msgTitle || 'Done';
      lines = s.msg || [];
      foot = 'ENTER continue';
    } else if (s.screen === 'erase') {
      title = 'Erase codes';
      const can = list.filter(c => c.state !== 'PERM').length;
      if (!can) {
        lines = ['No codes to erase.'];
        if (list.length) lines.push('Permanent codes clear', 'only when the chore', 'is done.');
      } else {
        lines = ['Erase ' + can + (can === 1 ? ' code?' : ' codes?'), 'Erased codes return', 'in 24 h if the chores', 'are not done.', 'Permanent codes stay.'];
        foot = 'ENTER erase  EXIT cancel';
      }
    } else if (s.screen === 'live') {
      const nxt = this.service().filter(x => x.days >= 0)[0];
      title = 'Live data';
      pairs = [
        kv('Health', this.health() + ' %'),
        kv('Overdue codes', this.overdue()),
        kv('Pending codes', list.filter(c => c.state === 'PEND').length),
        kv('Check apt lamp', lamp ? 'ON' : 'OFF'),
        kv('Streak', '0 d'),
        kv('Best streak', '12 d'),
        kv('Next service', nxt.name + ' ' + nxt.days + ' d'),
        kv('Tasks tracked', 18)
      ];
    } else if (s.screen === 'freezeList') {
      title = 'Freeze frame';
      if (!list.length) lines = ['No frames stored.'];
      else { rows = list.map((c, i) => row(c.id + ' ' + c.name, c.state, i === s.freezeIdx, i)); foot = moveFoot; }
    } else if (s.screen === 'freeze') {
      const c = find(s.sel);
      title = 'Frame ' + c.id;
      if (c.state === 'PEND') lines = ['No freeze frame.', 'Code is still pending.'];
      else {
        lines = [c.name];
        pairs = [kv('Set on', c.set), kv('Health at set', c.hSet + ' %'), kv('Streak at set', c.sSet + ' d'), kv('Last done', c.last), kv('Interval', c.interval)];
      }
    } else if (s.screen === 'ready') {
      title = 'Readiness';
      const zones = [['K', 'Kitchen'], ['B', 'Bath'], ['L', 'Living'], ['R', 'Bedroom'], ['U', 'Utility'], ['G', 'Whole apt']];
      const inc = z => this.codes().some(c => c.id.charAt(0) === z && ((c.state !== 'PEND' && s.status[c.id] !== 'done') || s.status[c.id] === 'snoozed'));
      pairs = zones.map(z => kv(z[1], inc(z[0]) ? 'INC' : 'RDY'));
      lines = [zones.filter(z => !inc(z[0])).length + ' of 6 zones ready'];
    } else if (s.screen === 'service') {
      title = 'Service due';
      pairs = this.service().map(x => kv(x.id + ' ' + x.name, x.days < 0 ? 'OVR ' + (-x.days) + ' d' : x.days + ' d'));
    } else if (s.screen === 'info') {
      title = 'Unit info';
      pairs = [kv('Unit ID', 'APT-01'), kv('Software', 'APT-OBD 1.0'), kv('ECU', 'Raspberry Pi 4'), kv('Interface', 'Web, Wi-Fi'), kv('Zones', 6), kv('Tasks', 18)];
    }

    return { title, lines, rows, pairs, foot, isBoot: boot, bar: s.progress + '%', lampOn: lamp };
  }

  renderVals() {
    return Object.assign({ t: this.theme() }, this.view(), {
      up: () => this.move(-1),
      down: () => this.move(1),
      enter: () => this.enter(),
      exit: () => this.exit()
    });
  }
}
</script>
